pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        jcenter()
        flatDir {
            dirs 'common-aar'
        }
    }
}
rootProject.name = "OcrLiteAndroidOnnx"
include ':app'
include ':OcrLibrary'
include ':appjava'
